<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Ubuntu Personal Server Security Console feature preview</title>
  <desc id="desc">A dark Cockpit-style security dashboard with alert totals, PostgreSQL charts, an event timeline, and optional components.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1d2939"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".26"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="627" rx="18" fill="#f8fafc" filter="url(#shadow)"/>
