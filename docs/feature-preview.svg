  <rect x="292" y="488" width="848" height="119" rx="11" fill="#fff" stroke="#dbe3ef"/>
  <text x="312" y="518" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Recent Security Timeline</text>
